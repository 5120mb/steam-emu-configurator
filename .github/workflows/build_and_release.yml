name: Build and release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check-out repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Executable
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: steam_emu_configurator.py
          mode: onefile
          include-package: dateparser.data,certifi
          include-package-data: dateparser
          deployment: true
          company-name: ${{ github.repository_owner }}
          product-name: ${{ github.event.repository.name }}
          file-version: ${{ github.ref_name }}
          product-version: ${{ github.ref_name }}
          output-file: ${{ github.event.repository.name }}.exe
          onefile-tempdir-spec: '{CACHE_DIR}/{COMPANY}/{PRODUCT}/{VERSION}'

      - name: Setup 7-zip
        uses: milliewalky/setup-7-zip@v2
        with:
          tag: latest

      - name: Compress executable
        run: |
          7z a -tzip ".\archives\${{ github.event.repository.name }}_win64_v${{ github.ref_name }}.zip" ".\build\${{ github.event.repository.name }}.exe"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: |
            archives/${{ github.event.repository.name }}_win64_v${{ github.ref_name }}.zip
          archive: false

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}_win64_v${{ github.ref_name }}.zip
          path: archives/
          skip-decompress: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            archives/*
          generate_release_notes: true
